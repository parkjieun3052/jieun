<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 연계 시스템</title>
    <style>
        #main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        #patient-result-section{
            background-color: gray;
        }
        #aii-patient{
            background-color: black;
            color: aliceblue;
        }
        #login-button{
            background-color: rgb(5, 153, 141);
            color: white;
            float: right;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <header>
        <aside>
            <button id="login-button" type="button" onclick="location.href='login/login.html'">로그인</button>
        </aside>
            <h1>상담 관리 시스템</h1>
            <p>상담사와 내담자를 연계하는 서비스입니다.</p>
        </header>

        <main>
            <section id="register-section">
                <h2>정보 등록</h2>

                <div class="button-group">
                    <button id="counselor-register-button" type="button" data-target="Registration/counselor.html">상담사 등록</button>
                    <button id="patient-register-button" type="button" data-target="Registration/patient.html">내담자 등록</button>
                </div>
            </section>
        </main>

        <footer>
            <h6>상담 연계 시스템</h6>
        </footer>

        <script src="../javascript/accept.js"></script>
        <script src="../javascript/counselor.js"></script>
        <script src="../javascript/inquiry.js"></script>
        <script src="../javascript/patient.js"></script>
        <script src="../javascript/main.js"></script>
    </div> <!-- End of main container div -->
</body>
</html>
