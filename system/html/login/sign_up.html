    
    <!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>회원가입 페이지</title>
        <style>
            #sign-up-button {
                background-color: rgb(0, 52, 36);
                color: white;
            }
        </style>
    </head>
    <body>
        <h1>회원 가입</h1>
        <p>서비스 이용을 위해 회원가입이 필요합니다.</p>

        <section>
            <div id="membertype">
                <h4>회원 유형 선택</h4>
                <form id="membertype-form">
                    <input type="radio" name="membertype" value="patient"> 내담자
                    <input type="radio" name="membertype" value="counselor"> 상담사
                    <input type="radio" name="membertype" value="trainee"> 수련생
                </form>
            </div>
        </section>
        <section>
            <div id="member-information">
                <h4>아이디 / 비밀번호 입력</h4>
                <form id="member-information-form">
                    아이디 : <input type="text" name="userid"><br><br>
                    비밀번호 : <input type="password" name="password"><br><br>
                    비밀번호 확인 : <input type="password" name="password-confirm"><br><br>
                    <h4>개인 정보 입력</h4>
                    이름 : <input type="text" name="name"> <br><br>
                    생년월일 : <input type="date" name="birthdate"><br><br>
                    성별 : <input type="radio" name="gender" value="male"> 남성
                    <input type="radio" name="gender" value="female"> 여성 <br><br>
                    이메일 : <input type="email" name="email"><br><br>
                    전화번호 : <input type="tel" name="phone"><br><br>
                    주소 : <input type="text" name="address"><br><br>
                    <button id="sign-up-button" type="submit">회원가입</button><br><br>
                </form>
            </div>
        </section>

        <script src="../../javascript/signup.js"></script>
    </body>
    </html>
