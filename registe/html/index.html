<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 연계 시스템</title>
    <style>
        #patient-result-section{
            background-color: gray;
        }
        #aii-patient{
            background-color: black;
            color: aliceblue;
        }

    </style>
</head>
<body>
    <header>
        <h1>상담 관리 시스템</h1>
        <p>상담사와 내담자를 연계하는 서비스입니다.</p>
    </header>

    <main>
        <section id="register-section">
            <h2>정보 등록</h2>

            <div class="button-group">
                <button id="counselor-register-button" type="button">상담사 등록</button>
                <button id="patient-register-button" type="button">내담자 등록</button>
            </div>
        </section>

        <section id="search-section">
            <h2>상담사 검색하기</h2>

            <div class="button-group">
                <button id="all-counselor-search" type="button">전체 상담사 조회하기</button>
                <button id="license-list-search" type="button">자격증별 상담사 조회하기</button>
            </div>

        </section>

        <section id="keyword-search-section">
            <form id="searchform">
                <h4>키워드로 검색하기</h4>
                <input id="keyword-input"type="text"placeholder="키워드를 입력하세요">
                <button type="submit">검색</button>
            </form>
        </section>
        <section id="result-section">
            <h5>검색 결과</h5>
            <div id="result">
                <p>키워드 검색 결과가 여기에 표시 됩니다</p>
            </div>
        </section>

        <section id="patient-result-section">
            <h2>상담사 전용 페이지</h2>
            <button id="aii-patient" type="button">전체 내담자 조회하기</button>
            <p>조회 결과가 여기에 표시됩니다.</p>

        </section>
    </main>

    <footer>
        <h6>상담 연계 시스템</h6>
    </footer>
</body>
</html>
